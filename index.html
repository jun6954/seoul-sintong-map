<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#1a1a2e; }
#app { display:flex; flex-direction:column; height:100vh; }

#header { background:#1a1a2e; padding:12px clamp(14px, 3vw, 28px) 9px; border-bottom:1px solid #2d2d4e; flex-shrink:0; }
#header h1 { font-size:clamp(15px, 1.7vw, 19px); font-weight:700; color:#f0f0ff; line-height:1.35; }
#header p  { font-size:clamp(10px, 1.2vw, 12px); color:#8a8ab0; margin-top:3px; line-height:1.45; }

#controls {
  background:#1a1a2e; padding:8px clamp(14px, 3vw, 28px);
  display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  border-bottom:1px solid #2d2d4e; flex-shrink:0;
}
.fbtn {
  min-height:32px; padding:6px 12px; border-radius:20px; border:1px solid #3a3a5e;
  font-size:12px; font-weight:600; cursor:pointer;
  background:transparent; color:#6a6a9a; font-family:inherit; transition:all .15s;
}
.fbtn.on-all { border-color:#a0a0c0; background:#2a2a4e; color:#e0e0ff; }
.fbtn.on-1   { border-color:#3b82f6; background:#1e3a8a33; color:#60a5fa; }
.fbtn.on-2   { border-color:#10b981; background:#06422233; color:#34d399; }
.fbtn.on-s   { border-color:#ef4444; background:#7f1d1d33; color:#f87171; }
.fbtn.on-sub { border-color:#f59e0b; background:#78350f33; color:#fbbf24; }

#map-wrap { flex:1; position:relative; }
#map { width:100%; height:100%; }

/* ── 사이드 패널 ── */
#side-panel {
  position:absolute; top:0; right:0; width:clamp(300px, 28vw, 380px); height:100%;
  background:rgba(15,15,30,0.97);
  border-left:1px solid #2d2d4e;
  z-index:1001;
  display:none;
  flex-direction:column;
  backdrop-filter:blur(12px);
  overflow:hidden;
}
#side-panel.open { display:flex; }

#panel-close {
  position:absolute; top:10px; right:12px;
  background:none; border:none; color:#6a6a9a;
  font-size:22px; cursor:pointer; z-index:10; line-height:1;
}
#panel-close:hover { color:#f0f0ff; }

#panel-img-wrap {
  width:100%; height:clamp(170px, 20vh, 220px); overflow:hidden;
  background:#0a0a1a; flex-shrink:0; position:relative;
}
#panel-img {
  width:100%; height:100%; object-fit:cover;
  display:block;
}
#panel-img-fallback {
  display:none; width:100%; height:100%;
  align-items:center; justify-content:center;
  color:#3a3a5e; font-size:12px;
}
#panel-img-label {
  position:absolute; bottom:8px; left:10px;
  background:rgba(0,0,0,0.7); color:#e0e0ff;
  font-size:10px; padding:2px 7px; border-radius:4px;
}

#panel-body { padding:18px 20px; overflow-y:auto; flex:1; }
#panel-type  { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; }
#panel-name  { font-size:17px; font-weight:700; color:#fff; margin:5px 0 3px; line-height:1.3; }
#panel-addr  { font-size:11px; color:#7a7aaa; margin-bottom:12px; }

.info-row {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:8px 0; border-bottom:1px solid #1e1e3e; font-size:12px;
}
.info-row:last-child { border-bottom:none; }
.info-label { color:#5a5a8a; flex-shrink:0; width:90px; }
.info-val   { color:#d0d0f0; text-align:right; flex:1; }

#panel-link {
  display:block; margin-top:14px;
  padding:9px 0; text-align:center;
  border:1px solid #3b82f6; border-radius:8px;
  color:#60a5fa; font-size:12px; font-weight:600;
  text-decoration:none; transition:all .15s;
}
#panel-link:hover { background:#1e3a8a44; }

/* ── 범례 ── */
#legend {
  position:absolute; bottom:20px; left:10px; z-index:1000;
  background:rgba(15,15,30,0.92); border:1px solid #2d2d4e;
  border-radius:8px; padding:9px 12px; backdrop-filter:blur(8px);
}
.leg-row { display:flex; align-items:center; gap:7px; margin-bottom:4px; font-size:11px; color:#a0a0c0; }
.leg-row:last-child { margin-bottom:0; }
.leg-dot { width:10px; height:10px; border-radius:50%; border:2px solid; flex-shrink:0; }

.subway-marker {
  width:7px; height:7px; border-radius:50%; border:1.5px solid #fff; opacity:.9;
}

/* 로딩 */
#loading-msg {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(15,15,30,0.9); color:#a0a0c0; padding:12px 20px;
  border-radius:8px; font-size:12px; z-index:500; pointer-events:none;
  border:1px solid #2d2d4e;
}

@media (max-width: 600px) {
  #header { padding-top:10px; }

  #controls { gap:5px; padding-top:7px; padding-bottom:7px; }
  .fbtn { flex:1 0 auto; padding:6px 9px; font-size:11px; }
  #btn-sub { margin-left:0!important; }
  #side-panel { width:100%; height:min(68%, 540px); top:auto; bottom:0; border-left:none; border-top:1px solid #2d2d4e; }
  #panel-img-wrap { height:145px; }
  #panel-body { padding:14px 16px; }
  #legend { bottom:12px; left:8px; padding:7px 9px; }
  .leg-row { font-size:10px; }
}

@media (min-width: 601px) and (max-width: 900px) {

  .fbtn { font-size:11px; padding-inline:10px; }
  #side-panel { width:330px; }
}

// ── 원형 구역 마커 ────────────────────────────────────────────────────────
function areaToRadius(areaStr) {
  const n = parseFloat(areaStr.replace(/[^\d.]/g,'')) * (areaStr.includes('만') ? 10000 : 1);
  return Math.min(Math.max(Math.sqrt(n/Math.PI)*0.55, 80), 250);
}

let zoneCircles = [];
let generalMarkers = [];
let activeCircle = null;

function refreshMap() { setTimeout(() => map.autoResize(), 0); }
function setOverlayVisible(overlay, visible) {
  overlay.setMap(visible ? map : null);
  overlay._visible = visible;
}
function setCircleStyle(circle, options) { circle.setOptions(options); }

function openPanel(zone, circle) {
  // 이전 활성 원 복원
  if (activeCircle && activeCircle !== circle) {
    setCircleStyle(activeCircle, { strokeWeight:2.5, strokeOpacity:0.9, fillOpacity:0.18 });
  }
  activeCircle = circle;
  setCircleStyle(circle, { strokeWeight:3.5, strokeOpacity:1, fillOpacity:0.32, zIndex:10 });

  const c = TYPE_COLOR[zone.type];
  const panel = document.getElementById('side-panel');
  document.getElementById('panel-img-wrap').style.display = 'block';

  // 이미지
  const imgEl = document.getElementById('panel-img');
  const fallback = document.getElementById('panel-img-fallback');
  imgEl.style.display = 'block';
  fallback.style.display = 'none';
  imgEl.src = BASE + zone.img;

  // 텍스트
  document.getElementById('panel-type').textContent =
    TYPE_LABEL[zone.type] + (zone.year ? ' (' + zone.year + ')' : '');
  document.getElementById('panel-type').style.color = c;
  document.getElementById('panel-name').textContent = zone.name;
  document.getElementById('panel-addr').textContent = zone.gu + ' ' + zone.addr;

  const rows = [
    ['구역면적', zone.area],
    ['용도지역', zone.zone],
    ...(zone.owners !== '-' ? [['토지등소유자', zone.owners]] : []),
  ];
  document.getElementById('panel-info').innerHTML = rows.map(([l,v])=>
    `<div class="info-row"><span class="info-label">${l}</span><span class="info-val">${v}</span></div>`
  ).join('');

  document.getElementById('panel-link').href = PAGE_URL;

  panel.classList.add('open');
  refreshMap();

  // 모바일이면 지도 중심 이동
  map.setCenter(new naver.maps.LatLng(zone.lat, zone.lng));
  map.setZoom(Math.max(map.getZoom(), 14));
}

function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  refreshMap();
  if (activeCircle) {
    setCircleStyle(activeCircle, { strokeWeight:2.5, strokeOpacity:0.9, fillOpacity:0.18, zIndex:1 });
    activeCircle = null;
  }
}

function imgFallback() {
  document.getElementById('panel-img').style.display = 'none';
  document.getElementById('panel-img-fallback').style.display = 'flex';
}

ZONES.forEach(zone => {
  const c = TYPE_COLOR[zone.type];
  const circle = new naver.maps.Circle({
    map,
    center: new naver.maps.LatLng(zone.lat, zone.lng),
    radius: areaToRadius(zone.area),
    strokeColor: c, strokeWeight:2.5, strokeOpacity:0.9,
    fillColor:c, fillOpacity:0.18, clickable:true, zIndex:1,
  });

  naver.maps.Event.addListener(circle, 'click', () => openPanel(zone, circle));
  naver.maps.Event.addListener(circle, 'mouseover', () => setCircleStyle(circle, { strokeWeight:3.5, fillOpacity:0.3, zIndex:10 }));
  naver.maps.Event.addListener(circle, 'mouseout', () => {
    if (circle !== activeCircle) setCircleStyle(circle, { strokeWeight:2.5, fillOpacity:0.18, zIndex:1 });
  });

  circle._zoneType = zone.type;
  circle._category = 'sintong';
  circle._visible = true;
  zoneCircles.push(circle);
});

function normalize(value) { return (value || '').replace(/[\s()·,.-]/g, '').replace(/구역|정비사업|조합/g, ''); }
function isOverlap(project) {
  const address = normalize(project.address);
  const name = normalize(project.name);
  return ZONES.some(zone => zone.gu === project.gu && (name.includes(normalize(zone.name)) || normalize(zone.name).includes(name) || (address.length > 4 && normalize(zone.addr).includes(address))));
}
function openGeneralPanel(project, overlap) {
  const panel = document.getElementById('side-panel');
  document.getElementById('panel-img-wrap').style.display = 'none';
  document.getElementById('panel-type').textContent = overlap ? '중복 사업장 · 신속통합기획 + 일반 정비사업' : '일반 정비사업';
  document.getElementById('panel-type').style.color = overlap ? OVERLAP_COLOR : GENERAL_COLOR;
  document.getElementById('panel-name').textContent = project.name;
  document.getElementById('panel-addr').textContent = `${project.gu} ${project.address}`;
  const rows = [['사업구분', project.business_type], ['진행단계', project.stage || '-'], ['공개자료', project.public_data_count], ['자료충실도', project.completeness]];
  document.getElementById('panel-info').innerHTML = rows.map(([l,v]) => `<div class="info-row"><span class="info-label">${l}</span><span class="info-val">${v || '-'}</span></div>`).join('');
  document.getElementById('panel-link').href = project.source_url;
  document.getElementById('panel-link').textContent = '서울시 정비사업 정보몽땅에서 보기 ↗';
  panel.classList.add('open');
  refreshMap();
}
async function loadGeneralProjects() {
  try {
    const response = await fetch('./data/general-projects.json');
    const { projects = [] } = await response.json();
    projects.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng)).forEach(project => {
      const overlap = isOverlap(project);
      const color = overlap ? OVERLAP_COLOR : GENERAL_COLOR;
      const size = overlap ? 16 : 12;
      const marker = new naver.maps.Marker({
        map,
        position: new naver.maps.LatLng(project.lat, project.lng),
        title: project.name,
        zIndex: overlap ? 20 : 5,
        icon: {
          content: `<span style="display:block;width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px #0008"></span>`,
          anchor: new naver.maps.Point(size / 2, size / 2),
        },
      });
      marker._category = overlap ? 'overlap' : 'general';
      marker._visible = true;
      naver.maps.Event.addListener(marker, 'click', () => openGeneralPanel(project, overlap));
      generalMarkers.push(marker);
    });
  } catch (error) { console.warn('일반 정비사업 데이터를 불러오지 못했습니다.', error); }
}
loadGeneralProjects();

// ── 필터 ─────────────────────────────────────────────────────────────────
function setFilter(f) {
  closePanel();
  ['all','sintong','general','overlap'].forEach((v,i)=>{
    const ids=['btn-all','btn-1','btn-2','btn-s'];
    const cls=['on-all','on-1','on-2','on-s'];
    document.getElementById(ids[i]).className = 'fbtn' + (v===f ? ' '+cls[i] : '');
  });
  zoneCircles.forEach(c => {
    const show = f==='all' || f==='sintong';
    setOverlayVisible(c, show);
  });
  generalMarkers.forEach(marker => {
    const show = f==='all' || marker._category===f;
    setOverlayVisible(marker, show);
  });
}
