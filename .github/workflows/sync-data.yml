name: Sync Seoul redevelopment data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 20 * * *" # 05:15 Asia/Seoul

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch official project list
        run: python scripts/fetch_general_projects.py --with-geometry
      - name: Commit changed data
        id: commit
        run: |
          if git diff --quiet -- data/general-projects.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/general-projects.json
          git commit -m "chore: sync Seoul redevelopment data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Notify Telegram
        if: steps.commit.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=서울 정비사업 지도 데이터가 갱신되었습니다. https://jun6954.github.io/seoul-sintong-map/"
